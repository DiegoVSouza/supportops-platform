[project]
name = "supportops-platform"
version = "0.4.3"
description = "Tenant-scoped support operations platform with deterministic AI boundaries"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.142.4",
  "mcp==2.3.0",
  "pydantic==2.14.1",
  "PyJWT==2.15.1",
  "supportops-ai-toolkit==0.2.0",
  "supportops-agents==0.1.1",
  "supportops-foundation==1.0.1",
  "supportops-obs==0.3.1",
  "supportops-async==0.1.4",
  "uvicorn==0.46.0",
  "redis==6.4.0",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.10",
  "langgraph==1.1.10",
  "langgraph-checkpoint-sqlite==3.1.2",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supportops_platform"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "supportops_platform/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.uv.sources]
supportops-ai-toolkit = { path = "artifacts/packages/supportops_ai_toolkit-0.2.0-py3-none-any.whl" }
supportops-agents = { path = "artifacts/packages/supportops_agents-0.1.1-py3-none-any.whl" }
supportops-foundation = { path = "artifacts/packages/supportops_foundation-1.0.1-py3-none-any.whl" }
supportops-obs = { path = "artifacts/packages/supportops_obs-0.3.1-py3-none-any.whl" }
supportops-async = { path = "artifacts/packages/supportops_async-0.1.4-py3-none-any.whl" }
