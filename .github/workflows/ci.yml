name: harness-checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@v6
        with: { version: '0.12.7' }
      - run: uv sync --locked
      - run: uv run --locked python scripts/check_full.py
        env:
          LLM_MODE: fake
