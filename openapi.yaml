  "components": {
    "schemas": {
      "ApprovalDecision": {
        "properties": {
          "decision": {
            "type": "string",
            "title": "Decision"
          }
        },
        "type": "object",
        "required": [
          "decision"
        ],
        "title": "ApprovalDecision"
      },
      "FeedbackSubmission": {
        "properties": {
          "rating": {
            "type": "integer",
            "maximum": 5.0,
            "minimum": 1.0,
            "title": "Rating"
          },
          "comment": {
            "type": "string",
            "maxLength": 1000,
            "title": "Comment",
            "default": ""
          },
          "ticket_id": {
            "type": "string",
            "maxLength": 100,
            "minLength": 1,
            "title": "Ticket Id"
          }
        },
        "type": "object",
        "required": [
          "rating",
          "ticket_id"
        ],
        "title": "FeedbackSubmission"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "RefundRequest": {
        "properties": {
          "amount_cents": {
            "type": "integer",
            "maximum": 5000.0,
            "exclusiveMinimum": 0.0,
            "title": "Amount Cents"
          }
        },
        "type": "object",
        "required": [
          "amount_cents"
        ],
        "title": "RefundRequest"
      },
      "TaskCreate": {
        "properties": {
          "ticket_id": {
            "type": "string",
            "maxLength": 100,
            "minLength": 1,
            "title": "Ticket Id"
          }
        },
        "type": "object",
        "required": [
          "ticket_id"
        ],
        "title": "TaskCreate"
      },
      "Ticket": {
        "properties": {
          "tenant_id": {
            "type": "string",
            "title": "Tenant Id"
          },
          "customer_id": {
            "type": "string",
            "title": "Customer Id"
          },
          "subject": {
            "type": "string",
            "title": "Subject"
          },
          "body": {
            "type": "string",
            "title": "Body"
          },
          "id": {
            "type": "string",
            "title": "Id"
          },
          "status": {
            "type": "string",
            "title": "Status",
            "default": "open"
          },
          "created_at": {
            "type": "string",
            "format": "date-time",
            "title": "Created At"
          }
        },
        "type": "object",
        "required": [
          "tenant_id",
          "customer_id",
          "subject",
          "body"
        ],
        "title": "Ticket"
      },
      "TicketApprovalDecision": {
        "properties": {
          "approval_id": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 100,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Approval Id"
          },
          "decision": {
            "type": "string",
            "title": "Decision",
            "default": "approved"
          }
        },
        "type": "object",
        "title": "TicketApprovalDecision"
      },
      "TicketCreate": {
        "properties": {
          "customer_id": {
            "type": "string",
            "maxLength": 100,
            "minLength": 1,
            "title": "Customer Id"
          },
          "subject": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1,
            "title": "Subject"
          },
          "body": {
            "type": "string",
            "maxLength": 10000,
            "minLength": 1,
            "title": "Body"
          }
        },
        "type": "object",
        "required": [
          "customer_id",
          "subject",
          "body"
        ],
        "title": "TicketCreate"
      },
      "TicketFeedback": {
        "properties": {
          "rating": {
            "type": "integer",
            "maximum": 5.0,
            "minimum": 1.0,
            "title": "Rating"
          },
          "comment": {
            "type": "string",
            "maxLength": 1000,
            "title": "Comment",
            "default": ""
          }
        },
        "type": "object",
        "required": [
          "rating"
        ],
        "title": "TicketFeedback"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    },
    "securitySchemes": {
      "HTTPBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    }
  }
}
